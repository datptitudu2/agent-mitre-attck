services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt uvicorn &&
             uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload"

